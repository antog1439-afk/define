<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Поисковик</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
        }
        
        .search-box {
            margin-bottom: 20px;
        }
        
        input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            border-radius: 24px;
            font-size: 16px;
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #000);
            outline: none;
        }
        
        input:focus {
            border-color: var(--tg-theme-button-color, #3390ec);
        }
        
        .platform {
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 10px;
            cursor: pointer;
            text-align: center;
            transition: transform 0.1s;
        }
        
        .platform:active {
            transform: scale(0.98);
        }
        
        .emoji {
            font-size: 28px;
            display: block;
            margin-bottom: 8px;
        }
        
        .name {
            font-weight: 600;
            font-size: 16px;
        }
        
        .info {
            font-size: 12px;
            color: var(--tg-theme-hint-color, #888);
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Поисковик</h1>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Введи запрос... Например: аватар 2" autocomplete="off">
        </div>
        
        <div class="platform" data-platform="youtube">
            <div class="emoji">📺</div>
            <div class="name">YouTube</div>
            <div class="info">Видео по запросу</div>
        </div>
        
        <div class="platform" data-platform="google">
            <div class="emoji">🌍</div>
            <div class="name">Google</div>
            <div class="info">Поиск в интернете</div>
        </div>
        
        <div class="platform" data-platform="news">
            <div class="emoji">📰</div>
            <div class="name">Новости</div>
            <div class="info">Свежие новости</div>
        </div>
        
        <div class="platform" data-platform="wildberries">
            <div class="emoji">🛒</div>
            <div class="name">Wildberries</div>
            <div class="info">Товары</div>
        </div>
        
        <div class="platform" data-platform="kinopoisk">
            <div class="emoji">🎬</div>
            <div class="name">Кинопоиск</div>
            <div class="info">Фильмы и сериалы</div>
        </div>
    </div>

    <script>
        // Инициализация
        let tg = window.Telegram.WebApp;
        tg.expand();
        
        let searchInput = document.getElementById('searchInput');
        
        // Отправка запроса боту
        function sendToBot(platform) {
            let query = searchInput.value.trim();
            
            if (query === "") {
                tg.showPopup({
                    title: "❌ Ошибка",
                    message: "Введи поисковый запрос!",
                    buttons: [{type: "ok"}]
                });
                return;
            }
            
            // Отправляем данные
            let data = JSON.stringify({
                query: query,
                platform: platform
            });
            
            console.log("Отправка:", data);
            tg.sendData(data);
            
            tg.showPopup({
                title: "🔍 Поиск начат",
                message: `Ищу "${query}"`,
                buttons: [{type: "ok"}]
            });
        }
        
        // Назначаем обработчики на платформы
        let platforms = document.querySelectorAll('.platform');
        for (let i = 0; i < platforms.length; i++) {
            platforms[i].onclick = function() {
                let platform = this.getAttribute('data-platform');
                sendToBot(platform);
            };
        }
        
        // Поиск по Enter
        searchInput.onkeypress = function(e) {
            if (e.key === 'Enter') {
                sendToBot('google');
            }
        };
        
        // Сообщаем Telegram, что приложение готово
        tg.ready();
        console.log("✅ Mini App загружен");
    </script>
</body>
</html>
