<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Универсальный помощник</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        .logo {
            font-size: 64px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--tg-theme-hint-color, #666666);
            margin-bottom: 30px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-input {
            flex: 1;
            padding: 14px 16px;
            border: 1px solid var(--tg-theme-hint-color, #cccccc);
            border-radius: 24px;
            font-size: 16px;
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #000000);
            outline: none;
        }

        .search-input:focus {
            border-color: var(--tg-theme-button-color, #3390ec);
        }

        .search-btn {
            padding: 14px 24px;
            background: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .examples {
            margin-top: 30px;
            text-align: left;
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            padding: 15px;
            border-radius: 16px;
        }

        .examples-title {
            font-size: 13px;
            color: var(--tg-theme-hint-color, #888888);
            margin-bottom: 10px;
        }

        .example-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .example-btn {
            padding: 6px 12px;
            background: var(--tg-theme-bg-color, #ffffff);
            border-radius: 16px;
            font-size: 12px;
            cursor: pointer;
            border: 1px solid var(--tg-theme-hint-color, #dddddd);
        }

        .info {
            margin-top: 20px;
            font-size: 12px;
            color: var(--tg-theme-hint-color, #888888);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🌐</div>
        <h1>Универсальный помощник</h1>
        <div class="subtitle">Введи название платформы или любой запрос</div>

        <div class="search-box">
            <input type="text" class="search-input" id="searchInput" placeholder="YouTube, Кинопоиск, новости..." autocomplete="off">
            <button class="search-btn" id="searchBtn">🔍</button>
        </div>

        <div class="examples">
            <div class="examples-title">🔥 Примеры запросов:</div>
            <div class="example-buttons">
                <div class="example-btn" data-query="youtube">YouTube</div>
                <div class="example-btn" data-query="кинопоиск">Кинопоиск</div>
                <div class="example-btn" data-query="wildberries">Wildberries</div>
                <div class="example-btn" data-query="ozon">Ozon</div>
                <div class="example-btn" data-query="яндекс новости">Новости Яндекса</div>
                <div class="example-btn" data-query="google">Google</div>
                <div class="example-btn" data-query="rutube">Rutube</div>
                <div class="example-btn" data-query="telegram">Telegram</div>
                <div class="example-btn" data-query="vk">VK</div>
                <div class="example-btn" data-query="chatgpt">ChatGPT</div>
            </div>
        </div>

        <div class="info">
            💡 Напиши название платформы — получу ссылку<br>
            🔍 Напиши любой другой запрос — поищу в Google
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.MainButton.hide();
        
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        
        function sendQuery(query) {
            if (!query || query.trim() === '') {
                tg.showPopup({
                    title: "❓ Пустой запрос",
                    message: "Введи название платформы или что найти",
                    buttons: [{type: "ok"}]
                });
                return;
            }
            
            // Отправляем данные боту
            tg.sendData(JSON.stringify({ query: query }));
            
            // Показываем сообщение, что запрос отправлен
            tg.showPopup({
                title: "🔍 Запрос отправлен",
                message: `"${query}"\nРезультат придёт в этот чат!`,
                buttons: [{type: "ok"}]
            });
        }
        
        searchBtn.addEventListener('click', () => {
            sendQuery(searchInput.value.trim());
        });
        
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendQuery(searchInput.value.trim());
            }
        });
        
        // Быстрые запросы
        document.querySelectorAll('.example-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const query = btn.dataset.query;
                searchInput.value = query;
                sendQuery(query);
            });
        });
        
        tg.ready();
        searchInput.focus();
    </script>
</body>
</html>
