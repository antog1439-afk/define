<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Новостной поиск</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 16px;
            min-height: 100vh;
        }
        .search-container {
            position: sticky;
            top: 0;
            background: var(--tg-theme-bg-color, #ffffff);
            padding-bottom: 12px;
            z-index: 10;
        }
        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .search-input {
            flex: 1;
            padding: 14px 16px;
            border: 1px solid var(--tg-theme-hint-color, #cccccc);
            border-radius: 24px;
            font-size: 16px;
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #000000);
            outline: none;
        }
        .search-input:focus {
            border-color: var(--tg-theme-button-color, #3390ec);
        }
        .search-btn {
            padding: 14px 24px;
            background: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .filter-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
        }
        .filter-chip {
            padding: 8px 16px;
            background: var(--tg-theme-secondary-bg-color, #e0e0e0);
            border-radius: 20px;
            font-size: 14px;
            white-space: nowrap;
            cursor: pointer;
        }
        .filter-chip.active {
            background: var(--tg-theme-button-color, #3390ec);
            color: white;
        }
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--tg-theme-hint-color, #888888);
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--tg-theme-hint-color, #888888);
        }
        .info-banner {
            background: var(--tg-theme-button-color, #3390ec);
            color: white;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 12px;
            text-align: center;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <div class="search-container">
        <div class="info-banner">
            🔍 Найди новости — результат придёт в чат
        </div>
        <div class="search-box">
            <input type="text" class="search-input" id="searchInput" placeholder="Поиск новостей... Например: технологии, космос" autocomplete="off">
            <button class="search-btn" onclick="searchNews()">Найти</button>
        </div>
        <div class="filter-bar" id="filterBar">
            <div class="filter-chip active" data-category="general">🔥 Все</div>
            <div class="filter-chip" data-category="technology">💻 Технологии</div>
            <div class="filter-chip" data-category="sports">⚽ Спорт</div>
            <div class="filter-chip" data-category="science">🔬 Наука</div>
            <div class="filter-chip" data-category="health">💊 Здоровье</div>
            <div class="filter-chip" data-category="entertainment">🎬 Развлечения</div>
            <div class="filter-chip" data-category="business">💼 Бизнес</div>
        </div>
    </div>

    <div class="results-container" id="resultsContainer">
        <div class="empty-state">
            🌐 Введи запрос или выбери категорию<br>
            <small>Новости придут в этот чат</small>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.MainButton.hide();
        
        let currentCategory = 'general';
        
        document.querySelectorAll('.filter-chip').forEach(chip => {
            chip.addEventListener('click', () => {
                document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                currentCategory = chip.dataset.category;
                document.getElementById('searchInput').value = '';
                loadTopNews();
            });
        });
        
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchNews();
        });
        
        function searchNews() {
            const query = document.getElementById('searchInput').value.trim();
            
            showLoading();
            
            tg.sendData(JSON.stringify({
                query: query,
                category: currentCategory
            }));
            
            setTimeout(() => {
                tg.close();
            }, 500);
        }
        
        function loadTopNews() {
            showLoading();
            
            tg.sendData(JSON.stringify({
                query: "",
                category: currentCategory
            }));
            
            setTimeout(() => {
                tg.close();
            }, 500);
        }
        
        function showLoading() {
            document.getElementById('resultsContainer').innerHTML = `
                <div class="loading">
                    ⏳ Ищем новости...<br>
                    <small>Отправляю запрос боту</small>
                </div>
            `;
        }
        
        tg.ready();
    </script>
</body>
</html>
